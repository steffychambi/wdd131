<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1350" width="100%" height="100%" style="background-color: #ffffff; font-family: sans-serif;">
  <style>
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
    .header-box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; }
    .nav-bar { fill: #2563eb; }
    .nav-text { fill: #ffffff; font-size: 12px; font-weight: bold; }
    .title-text { fill: #1f2937; font-weight: bold; font-size: 14px; }
    .btn { fill: #2563eb; rx: 6px; }
    .btn-text { fill: #ffffff; font-weight: bold; font-size: 13px; }
    .card { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; rx: 6px; }
  </style>

  <!-- MARCO TELEFONO -->
  <rect x="10" y="10" width="360" height="1330" rx="20" fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- HEADER -->
  <g id="header-mobile">
    <rect x="20" y="30" width="340" height="90" class="header-box"/>
    <text x="35" y="55" class="title-text" font-size="15">🧭 Compass</text>
    <text x="325" y="55" text-anchor="end" class="title-text" font-size="14">☰ Menu</text>
    
    <text x="190" y="80" text-anchor="middle" class="title-text" font-size="13">Site Title &amp; Slogan</text>
    <text x="190" y="100" text-anchor="middle" fill="#475569" font-size="11">"Career Compass: Plan. Learn. Grow."</text>
    
    <!-- MENU DESPLEGADO (AZUL) -->
    <rect x="20" y="120" width="340" height="110" class="nav-bar"/>
    <text x="190" y="142" text-anchor="middle" class="nav-text">• Study Tips</text>
    <text x="190" y="165" text-anchor="middle" class="nav-text">• Dynamic Career Cards</text>
    <text x="190" y="188" text-anchor="middle" class="nav-text">• LocalStorage Save Progress</text>
    <text x="190" y="211" text-anchor="middle" class="nav-text">• Learning Resources</text>
  </g>

  <!-- 1. HERO SECTION -->
  <g id="hero-mobile" transform="translate(0, 240)">
    <rect x="20" y="0" width="340" height="220" class="card"/>
    <line x1="20" y1="0" x2="360" y2="220" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="360" y1="0" x2="20" y2="220" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="190" y="90" text-anchor="middle" class="title-text" font-size="13">Large Career Explorer Hero Image</text>
    <text x="190" y="110" text-anchor="middle" fill="#64748b" font-size="12">(Compass &amp; Students)</text>
    
    <rect x="120" y="150" width="140" height="38" class="btn"/>
    <text x="190" y="174" text-anchor="middle" class="btn-text">Comenzar CTA</text>
  </g>

  <!-- 2. CAREERS CARD SECTION -->
  <g id="careers-mobile" transform="translate(0, 480)">
    <rect x="20" y="0" width="340" height="390" class="card" fill="#f8fafc"/>
    <text x="190" y="30" text-anchor="middle" class="title-text" font-size="15">Careers Card &amp; Search Box</text>
    
    <text x="35" y="55" fill="#475569" font-size="12">Search Careers Input</text>
    <rect x="35" y="65" width="310" height="35" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="45" y="87" fill="#94a3b8" font-size="12">Buscar carreras...</text>
    
    <!-- Tarjetas apiladas -->
    <rect x="35" y="110" width="310" height="80" class="card"/>
    <rect x="45" y="120" width="40" height="40" fill="none" stroke="#cbd5e1"/>
    <line x1="45" y1="120" x2="85" y2="160" stroke="#cbd5e1"/>
    <line x1="85" y1="120" x2="45" y2="160" stroke="#cbd5e1"/>
    <text x="95" y="135" class="title-text" font-size="13">Web Developer</text>
    <text x="95" y="155" fill="#475569" font-size="11">Descriptive inrad and Web...</text>
    <text x="95" y="170" fill="#475569" font-size="11">Salary: $20.0 - $10K</text>

    <rect x="35" y="200" width="310" height="70" class="card"/>
    <rect x="45" y="210" width="40" height="40" fill="none" stroke="#cbd5e1"/>
    <line x1="45" y1="210" x2="85" y2="250" stroke="#cbd5e1"/>
    <line x1="85" y1="210" x2="45" y2="250" stroke="#cbd5e1"/>
    <text x="95" y="230" class="title-text" font-size="13">Graphic Designer</text>
    <text x="95" y="250" fill="#475569" font-size="11">Descriptive inrad...</text>

    <rect x="35" y="280" width="310" height="70" class="card"/>
    <rect x="45" y="290" width="40" height="40" fill="none" stroke="#cbd5e1"/>
    <line x1="45" y1="290" x2="85" y2="330" stroke="#cbd5e1"/>
    <line x1="85" y1="290" x2="45" y2="330" stroke="#cbd5e1"/>
    <text x="95" y="310" class="title-text" font-size="13">Data Analyst</text>
    <text x="95" y="330" fill="#475569" font-size="11">Data Analyst and data...</text>
  </g>

  <!-- 3. STUDY TASK PLANNER (ABAJO DE CAREERS) -->
  <g id="planner-mobile" transform="translate(0, 890)">
    <rect x="20" y="0" width="340" height="340" class="card" fill="#f8fafc"/>
    <text x="190" y="30" text-anchor="middle" class="title-text" font-size="15">Study Task Planner Box</text>
    
    <rect x="175" y="40" width="30" height="30" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M 180 55 L 188 63 L 200 47" fill="none" stroke="#1f2937" stroke-width="3"/>

    <text x="35" y="90" class="title-text" font-size="12">Add New Study Task</text>
    <text x="35" y="110" fill="#475569" font-size="11">Add task</text>
    <rect x="35" y="120" width="230" height="35" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="275" y="120" width="70" height="35" class="btn"/>
    <text x="310" y="142" text-anchor="middle" class="btn-text">Add</text>

    <rect x="35" y="175" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <path d="M 37 184 L 42 189 L 51 177" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <text x="60" y="189" class="title-text" font-size="12">Complete HTML assignment</text>

    <rect x="35" y="210" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="60" y="224" class="title-text" font-size="12" fill="#64748b">Research career skills</text>

    <rect x="35" y="240" width="18" height="18" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="60" y="254" class="title-text" font-size="12" fill="#64748b">Finalize study plan</text>

    <text x="35" y="285" class="title-text" font-size="12">Progress</text>
    <rect x="35" y="295" width="310" height="16" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="35" y="295" width="180" height="16" rx="8" fill="#22c55e"/>
  </g>

  <!-- FOOTER -->
  <g id="footer-mobile" transform="translate(0, 1250)">
    <rect x="20" y="0" width="340" height="70" fill="#ffffff"/>
    <line x1="20" y1="0" x2="360" y2="0" stroke="#1f2937" stroke-width="1.5"/>
    <text x="190" y="30" text-anchor="middle" fill="#475569" font-size="11">© 2023 Career Compass | ✉️ Contact Us</text>
    <text x="190" y="50" text-anchor="middle" fill="#94a3b8" font-size="10">Last Modified: 2023-11-20</text>
  </g>
</svg>
