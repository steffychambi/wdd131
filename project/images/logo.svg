<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <!-- Gradientes con la nueva paleta -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="40%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="greenNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="purpleNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="compass-main">
    <!-- ASA / ANILLO SUPERIOR -->
    <g transform="translate(300, 110)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#1F2937" stroke-width="22"/>
      <circle cx="0" cy="0" r="55" fill="none" stroke="url(#purpleGrad)" stroke-width="16"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="#F3E8FF" stroke-width="2" opacity="0.8"/>
      <path d="M -22 42 L 22 42 L 18 65 L -18 65 Z" fill="url(#purpleGrad)" stroke="#1F2937" stroke-width="4" stroke-linejoin="round"/>
      <ellipse cx="0" cy="47" rx="16" ry="4" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- CUERPO PRINCIPAL -->
    <circle cx="300" cy="360" r="215" fill="#1F2937" />
    <circle cx="300" cy="360" r="210" fill="url(#purpleGrad)" stroke="#1F2937" stroke-width="4"/>
    <circle cx="300" cy="360" r="190" fill="#7C3AED" stroke="#1F2937" stroke-width="3"/>
    
    <!-- ESFERA INTERIOR (Fondo Lavanda Claro) -->
    <circle cx="300" cy="360" r="172" fill="#1F2937"/>
    <circle cx="300" cy="360" r="168" fill="#F3E8FF"/>

    <!-- Remaches alrededor del marco -->
    <g fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5">
      <circle cx="300" cy="160" r="5"/>
      <circle cx="500" cy="360" r="5"/>
      <circle cx="300" cy="560" r="5"/>
      <circle cx="100" cy="360" r="5"/>
      <circle cx="158" cy="218" r="4"/>
      <circle cx="442" cy="218" r="4"/>
      <circle cx="442" cy="502" r="4"/>
      <circle cx="158" cy="502" r="4"/>
    </g>

    <!-- BRILLO CURVO DEL CRISTAL -->
    <path d="M 145 300 A 168 168 0 0 1 420 220 A 168 168 0 0 0 145 300 Z" fill="#FFFFFF" opacity="0.5"/>

    <!-- ESCALA DE LA BRÚJULA (Gris Oscuro) -->
    <g stroke="#1F2937" stroke-linecap="round" opacity="0.85">
      <line x1="300" y1="200" x2="300" y2="212" stroke-width="3.5"/>
      <line x1="300" y1="520" x2="300" y2="508" stroke-width="3.5"/>
      <line x1="140" y1="360" x2="152" y2="360" stroke-width="3.5"/>
      <line x1="460" y1="360" x2="448" y2="360" stroke-width="3.5"/>
      
      <line x1="187" y1="247" x2="197" y2="257" stroke-width="2.5"/>
      <line x1="413" y1="247" x2="403" y2="257" stroke-width="2.5"/>
      <line x1="187" y1="473" x2="197" y2="463" stroke-width="2.5"/>
      <line x1="413" y1="473" x2="403" y2="463" stroke-width="2.5"/>
    </g>

    <!-- Círculos punteados de la escala -->
    <circle cx="300" cy="360" r="110" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3,6" opacity="0.6"/>
    <circle cx="300" cy="360" r="70" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.5"/>

    <!-- DECORACIONES DE FONDO (Puntos Verde Éxito y Gris) -->
    <g opacity="0.8">
      <path d="M 390 280 Q 390 290 400 290 Q 390 290 390 300 Q 390 290 380 290 Q 390 290 390 280 Z" fill="#22C55E"/>
      <path d="M 210 420 Q 210 430 220 430 Q 210 430 210 440 Q 210 430 200 430 Q 210 430 210 420 Z" fill="#1F2937"/>
      <circle cx="360" cy="225" r="3" fill="#22C55E"/>
      <circle cx="240" cy="495" r="3" fill="#1F2937"/>
    </g>

    <!-- ROSA DE LOS VIENTOS -->
    <g id="compass-rose">
      <!-- Diagonales -->
      <g stroke="#1F2937" stroke-width="1.5" stroke-linejoin="round">
        <polygon points="300,360 310,315 355,305" fill="#C4B5FD"/>
        <polygon points="300,360 345,345 355,305" fill="#7C3AED"/>
        <polygon points="300,360 345,375 355,415" fill="#C4B5FD"/>
        <polygon points="300,360 310,405 355,415" fill="#7C3AED"/>
        <polygon points="300,360 290,405 245,415" fill="#C4B5FD"/>
        <polygon points="300,360 255,375 245,415" fill="#7C3AED"/>
        <polygon points="300,360 255,345 245,305" fill="#C4B5FD"/>
        <polygon points="300,360 290,315 245,305" fill="#7C3AED"/>
      </g>

      <!-- Principales -->
      <g stroke="#1F2937" stroke-width="2" stroke-linejoin="round">
        <polygon points="300,360 282,360 300,230" fill="#FFFFFF"/>
        <polygon points="300,360 318,360 300,230" fill="#7C3AED"/>
        <polygon points="300,360 318,360 300,490" fill="#FFFFFF"/>
        <polygon points="300,360 282,360 300,490" fill="#1F2937"/>
        <polygon points="300,360 300,342 430,360" fill="#FFFFFF"/>
        <polygon points="300,360 300,378 430,360" fill="#7C3AED"/>
        <polygon points="300,360 300,378 170,360" fill="#FFFFFF"/>
        <polygon points="300,360 300,342 170,360" fill="#1F2937"/>
      </g>
    </g>

    <!-- AGUJA -->
    <g id="needle" transform="rotate(22, 300, 360)">
      <!-- Sombra interior -->
      <polygon points="300,360 320,360 305,175" fill="#1F2937" opacity="0.2" transform="translate(6, 6)"/>
      <polygon points="300,360 280,360 295,525" fill="#1F2937" opacity="0.2" transform="translate(6, 6)"/>

      <!-- Norte (Verde Éxito) -->
      <g stroke="#1F2937" stroke-width="2" stroke-linejoin="round">
        <polygon points="300,360 274,360 300,160" fill="#86EFAC"/>
        <polygon points="300,360 326,360 300,160" fill="url(#greenNeedle)"/>
      </g>

      <!-- Sur (Púrpura Principal a Gris Oscuro) -->
      <g stroke="#1F2937" stroke-width="2" stroke-linejoin="round">
        <polygon points="300,360 326,360 300,520" fill="#1F2937"/>
        <polygon points="300,360 274,360 300,520" fill="url(#purpleNeedle)"/>
      </g>

      <!-- Centro -->
      <circle cx="300" cy="360" r="22" fill="#1F2937"/>
      <circle cx="300" cy="360" r="18" fill="url(#purpleGrad)"/>
      <circle cx="300" cy="360" r="12" fill="#22C55E"/>
      <circle cx="296" cy="356" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Destello superior del cristal -->
    <ellipse cx="220" cy="210" rx="35" ry="12" transform="rotate(-40, 220, 210)" fill="#FFFFFF" opacity="0.6" filter="url(#glow)"/>
  </g>
</svg>

